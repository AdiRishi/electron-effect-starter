<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.classList.toggle(
        "dark",
        window.matchMedia("(prefers-color-scheme: dark)").matches,
      );
    </script>
    <style>
      /* The boot error screen must render even when the app's stylesheet failed to load. */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        height: 100%;
        justify-content: center;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #boot-error {
        --boot-error-fg: #262626;
        --boot-error-bg: #ffffff;
        --boot-error-line: color-mix(in srgb, currentColor 12%, transparent);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: flex-start;
        width: min(400px, calc(100% - 48px));
        padding: clamp(24px, 22vh, 220px) 0 24px;
        font-size: 13px;
        line-height: 20px;
      }

      html.dark #boot-error {
        --boot-error-fg: #f5f5f5;
        --boot-error-bg: #0a0a0a;
      }

      #boot-error h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      #boot-error p {
        margin: 4px 0 0;
        opacity: 0.7;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      #boot-error pre {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      #boot-error :is(button, summary, pre):focus-visible {
        outline: 2px solid var(--boot-error-fg);
        outline-offset: 2px;
      }

      #boot-error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      #boot-error #boot-error-reload {
        border-color: var(--boot-error-fg);
        background: var(--boot-error-fg);
        color: var(--boot-error-bg);
      }

      #boot-error-reload:hover {
        opacity: 0.9;
      }

      #boot-error details {
        width: 100%;
        margin-top: 32px;
      }

      #boot-error summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 4px;
        list-style: none;
        opacity: 0.7;
        cursor: pointer;
      }

      #boot-error summary::-webkit-details-marker {
        display: none;
      }

      #boot-error summary::before {
        content: "";
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
      }

      #boot-error details[open] summary::before {
        transform: rotate(45deg);
      }

      #boot-error summary:hover,
      #boot-error details[open] summary {
        opacity: 1;
      }

      #boot-error details > :not(summary) {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }

      #boot-error details p {
        margin: 0;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error-details {
        max-height: 200px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        font-size: 11px;
        line-height: 16px;
        white-space: pre-wrap;
        opacity: 0.8;
      }

      #boot-error-report {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #boot-error-report button {
        height: 28px;
        padding: 0 10px;
      }

      .boot-error-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <title>Electron Effect Starter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
