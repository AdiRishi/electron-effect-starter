# Pushing a v*.*.* tag builds installers for macOS, Windows and Linux and publishes them to a GitHub
# release, which installed apps update from.
#
# macOS builds are signed and notarized when these repository secrets are set; without them the
# build is unsigned and macOS auto-update does not work:
#   CSC_LINK, CSC_KEY_PASSWORD  the Developer ID Application certificate as a base64 .p12, and its password
#   APPLE_API_KEY               the App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # electron-builder reads APPLE_API_KEY as a path to the .p8 key.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          fi
      - run: pnpm dist:desktop --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
